<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LuxeStays</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Simple return home nav -->
    <nav style="background: transparent; border: none;">
        <a href="index.html" class="logo">LuxeStays</a>
    </nav>

    <div class="auth-container">
        <div class="auth-box fade-in">
            <h2>Create Account</h2>
            <form>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required style="width: 100%;">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required style="width: 100%;">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required style="width: 100%;">
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
